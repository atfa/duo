name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: Go ${{ matrix.go }} / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            go: 1.24.x
          - os: ubuntu-latest
            go: stable
          - os: macos-latest
            go: stable
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - name: Build driver plugins for tests
        run: |
          mkdir -p "$RUNNER_TEMP/duo-bin"
          for pkg in $(go list ./cmd/duo-plugin-*); do
            go build -o "$RUNNER_TEMP/duo-bin/$(basename "$pkg")" "$pkg"
          done
          echo "$RUNNER_TEMP/duo-bin" >> "$GITHUB_PATH"
      - name: Test
        run: go test ./...
      - name: Gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt -l reported:"
            echo "$unformatted"
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./cmd/duo
      # Windows is a supported runtime, not an afterthought: the platform split in
      # the PTY, session lock and shell layers only stays honest if a Windows build
      # and vet run on every change.
      - name: Build for Windows
        run: |
          mkdir -p "$RUNNER_TEMP/windows-bin"
          GOOS=windows CGO_ENABLED=0 go build -o "$RUNNER_TEMP/windows-bin/" ./cmd/...
      - name: Vet for Windows
        run: GOOS=windows go vet ./...

  frontend:
    name: Frontend tests / ubuntu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: pi-extension tests
        run: bun test
        working-directory: pi-extension
      - name: opencode-extension tests
        run: bun run test
        working-directory: opencode-extension
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: remote tests
        run: npm run check
        working-directory: remote
