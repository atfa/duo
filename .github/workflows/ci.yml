name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: Go ${{ matrix.go }} / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            go: 1.24.x
          - os: ubuntu-latest
            go: stable
          - os: macos-latest
            go: stable
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - name: Build driver plugins for tests
        run: |
          mkdir -p "$RUNNER_TEMP/duo-bin"
          for pkg in $(go list ./cmd/duo-plugin-*); do
            go build -o "$RUNNER_TEMP/duo-bin/$(basename "$pkg")" "$pkg"
          done
          echo "$RUNNER_TEMP/duo-bin" >> "$GITHUB_PATH"
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./cmd/duo
