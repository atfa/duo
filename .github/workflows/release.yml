name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Build driver plugins for tests
        run: |
          mkdir -p "$RUNNER_TEMP/duo-bin"
          for pkg in $(go list ./cmd/duo-plugin-*); do
            go build -o "$RUNNER_TEMP/duo-bin/$(basename "$pkg")" "$pkg"
          done
          echo "$RUNNER_TEMP/duo-bin" >> "$GITHUB_PATH"
      - run: go test ./...
      - run: go vet ./...
      - run: CGO_ENABLED=0 go build ./cmd/...

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
            runner: ubuntu-24.04
          - os: linux
            arch: arm64
            runner: ubuntu-24.04-arm
          - os: darwin
            arch: amd64
            runner: macos-15-intel
          - os: darwin
            arch: arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Build Duo archive
        env:
          TARGET_OS: ${{ matrix.os }}
          TARGET_ARCH: ${{ matrix.arch }}
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          actual_arch="$(uname -m)"
          case "$TARGET_ARCH:$actual_arch" in
            amd64:x86_64|arm64:aarch64|arm64:arm64) ;;
            *) echo "runner architecture $actual_arch does not match $TARGET_ARCH" >&2; exit 1 ;;
          esac
          mkdir -p dist/package
          for pkg in $(go list ./cmd/...); do
            name="$(basename "$pkg")"
            CGO_ENABLED=0 GOOS="$TARGET_OS" GOARCH="$TARGET_ARCH" \
              go build -trimpath -ldflags="-s -w" -o "dist/package/$name" "$pkg"
          done
          cp -R pi-extension dist/package/pi-extension
          mkdir -p dist/package/opencode-extension
          cp opencode-extension/*.ts dist/package/opencode-extension/
          cp README.md LICENSE dist/package/
          tar -C dist/package -czf "dist/duo_${TARGET_OS}_${TARGET_ARCH}.tar.gz" .
      - uses: actions/upload-artifact@v4
        with:
          name: duo-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*.tar.gz

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: duo-*
          merge-multiple: true
          path: artifacts
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null || \
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes --verify-tag
          # One checksum file over the exact archives this release ships,
          # published beside them. `duo upgrade` refuses an archive the release
          # does not account for, so a missing file is a visible failure and
          # never a silent unverified install. sha256sum's own
          # "<hash>  <name>" format is kept: `sha256sum -c` verifies it by hand.
          (cd artifacts && sha256sum ./*.tar.gz > SHA256SUMS && cat SHA256SUMS)
          gh release upload "$GITHUB_REF_NAME" \
            artifacts/*.tar.gz artifacts/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --clobber
