<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <meta name="robots" content="noindex, nofollow">
  <title>DUO remote</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <main class="shell">
    <header class="masthead">
      <span class="mark" aria-hidden="true">DUO</span>
      <span id="title" class="title">Duo</span>
      <span id="status" class="status status-wait" role="status" aria-live="polite">connecting</span>
    </header>

    <p id="banner" class="banner" hidden></p>

    <section class="card" aria-labelledby="head-facts">
      <h1 id="head-facts">Session</h1>
      <dl class="facts">
        <dt>Room</dt><dd id="room" class="mono">—</dd>
        <dt>Mode</dt><dd id="mode">—</dd>
        <dt>Phase</dt><dd id="phase">—</dd>
        <dt>Step</dt><dd id="step">—</dd>
        <dt>Expires</dt><dd id="expiry">—</dd>
      </dl>
      <div class="control">
        <label for="modes">Switch mode</label>
        <select id="modes" autocomplete="off">
          <option value="fast">Fast</option>
          <option value="step">Step</option>
          <option value="goal">Goal</option>
        </select>
      </div>
      <p id="plan" class="plan"></p>
    </section>

    <section class="card" aria-labelledby="head-agents">
      <h1 id="head-agents">Agents</h1>
      <ul id="agents" class="agents"></ul>
    </section>

    <section class="card" aria-labelledby="head-activity">
      <h1 id="head-activity">Recent activity</h1>
      <ul id="activity" class="activity"><li class="muted">No activity yet.</li></ul>
    </section>

    <section class="card" aria-labelledby="head-observer">
      <h1 id="head-observer">Observer</h1>
      <p id="observer" class="observer muted">No report yet.</p>
      <button id="refresh" type="button" class="ghost">Refresh report</button>
    </section>

    <section class="card" aria-labelledby="head-command">
      <h1 id="head-command">Send a command</h1>
      <form id="composer" class="composer">
        <label class="sr-only" for="task">Task for Duo</label>
        <textarea id="task" rows="3" placeholder="Tell Duo what to do…" autocomplete="off"></textarea>
        <div class="actions">
          <button id="send" type="submit">Send</button>
          <button id="newsess" type="button" class="ghost">New session</button>
        </div>
      </form>
      <p id="sent" class="sent" role="status" aria-live="polite"></p>
    </section>

    <footer class="foot">
      <p>Everything runs on your computer. This relay only forwards encrypted frames.</p>
    </footer>
  </main>
</body>
</html>
